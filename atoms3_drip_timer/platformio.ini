; PlatformIO 프로젝트 설정 - M5Stack AtomS3 드립 타이머
; VS Code + PlatformIO IDE 확장에서 이 폴더(atoms3_drip_timer)를 열면
; 보드/라이브러리가 자동 설치되고, 업로드(→) 버튼으로 플래싱됩니다.

[platformio]
src_dir = .            ; .ino 소스가 이 폴더에 있음

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    bblanchon/ArduinoJson @ ^7.0.0

; 빌드 산출물/캐시는 커밋하지 않습니다 (.gitignore 참고)
