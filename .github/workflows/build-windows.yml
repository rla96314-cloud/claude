name: Build Windows EXE

# 수동 실행(Actions 탭의 Run workflow) 또는 관련 파일 push 시 자동 빌드
on:
  workflow_dispatch:
  push:
    paths:
      - "youtube_downloader.py"
      - "build_exe.py"
      - "requirements-youtube.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-youtube.txt

      - name: ffmpeg 다운로드 (실행파일에 내장)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Write-Host "Downloading ffmpeg from $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          # 압축 안의 bin/ffmpeg.exe, ffprobe.exe 를 저장소 루트로 복사 -> build_exe.py 가 자동 번들
          Copy-Item (Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe  | Select-Object -First 1).FullName -Destination ffmpeg.exe  -Force
          Copy-Item (Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1).FullName -Destination ffprobe.exe -Force
          Get-Item ffmpeg.exe, ffprobe.exe | Format-Table Name, Length

      - name: 실행파일 빌드
        run: python build_exe.py

      - name: EXE 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: dist/YouTubeDownloader.exe
          if-no-files-found: error
